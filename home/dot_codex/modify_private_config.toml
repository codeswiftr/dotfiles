#!/bin/sh
# chezmoi modify script for ~/.codex/config.toml (live file arrives on stdin).
#
# Codex rewrites this file itself (trusted projects, hook hashes, model nudges),
# so it is NOT templated whole. We only pin the two approval-policy keys and
# leave every other line alone:
#   approval_policy = "on-request"
#   sandbox_mode    = "workspace-write"
#
# - Only top-level keys (before the first [table]) are touched; the same names
#   inside tables or profiles are left alone.
# - If a key exists with another value it is replaced in place; if missing it is
#   inserted after the last top-level line.
# - If both keys already hold the wanted values the input is emitted unchanged
#   (byte for byte), so apply is a no-op.
# - Empty stdin (fresh machine) yields just the two keys.
set -eu

in=$(mktemp)
out=$(mktemp)
trap 'rm -f "$in" "$out"' EXIT
cat >"$in"

rc=0
awk '
  function wanted(k, v) { return "^[ \t]*" k "[ \t]*=[ \t]*\"" v "\"[ \t]*(#.*)?$" }
  { line[NR] = $0 }
  END {
    n = NR
    first_table = n + 1
    for (i = 1; i <= n; i++) if (line[i] ~ /^[ \t]*\[/) { first_table = i; break }

    seen_a = 0; seen_s = 0; changed = 0
    for (i = 1; i < first_table; i++) {
      if (line[i] ~ /^[ \t]*approval_policy[ \t]*=/) {
        seen_a = 1
        if (line[i] !~ wanted("approval_policy", "on-request")) { line[i] = "approval_policy = \"on-request\""; changed = 1 }
      } else if (line[i] ~ /^[ \t]*sandbox_mode[ \t]*=/) {
        seen_s = 1
        if (line[i] !~ wanted("sandbox_mode", "workspace-write")) { line[i] = "sandbox_mode = \"workspace-write\""; changed = 1 }
      }
    }

    add = ""
    if (!seen_a) add = add "approval_policy = \"on-request\"\n"
    if (!seen_s) add = add "sandbox_mode = \"workspace-write\"\n"
    if (add != "") changed = 1

    if (!changed) exit 3

    # insertion point: after the last non-blank top-level line
    p = 0
    for (i = 1; i < first_table; i++) if (line[i] !~ /^[ \t]*$/) p = i

    for (i = 1; i <= p; i++) print line[i]
    if (add != "") printf "%s", add
    for (i = p + 1; i <= n; i++) print line[i]
  }
' "$in" >"$out" || rc=$?

case "$rc" in
  0) cat "$out" ;;
  3) cat "$in" ;;
  *) exit "$rc" ;;
esac
