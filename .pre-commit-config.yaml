---
minimum_pre_commit_version: "3.5.0"
default_install_hook_types: [pre-commit, commit-msg, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending

  # Shell formatting and lint
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.7.0-4
    hooks:
      - id: shfmt
        files: \.(sh|bash|zsh)$
        args: ["-i", "2", "-bn", "-ci"]

  - repo: https://github.com/jumanjihouse/pre-commit-hooks
    rev: 3.0.0
    hooks:
      - id: shellcheck
        files: \.(sh|bash|zsh)$

  # Python
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.8
    hooks:
      - id: ruff
        args: ["--fix"]
        exclude: ^(\.venv|\.env|.*/site-packages/)
      - id: ruff-format

  # JavaScript/TypeScript formatting with Prettier (if Node installed)
  - repo: local
    hooks:
      - id: prettier-local
        name: prettier (local if available)
        entry: bash -lc 'command -v prettier >/dev/null 2>&1 || exit 0; prettier --write "$@"'
        language: system
        pass_filenames: true
        types_or: [javascript, jsx, ts, tsx, json, yaml, markdown]

  # Swift tools (best-effort, no-op if missing)
  - repo: local
    hooks:
      - id: swiftformat-local
        name: swiftformat (local if available)
        entry: bash -lc 'command -v swiftformat >/dev/null 2>&1 || exit 0; swiftformat .'
        language: system
        pass_filenames: false
        files: \.(swift)$
      - id: swiftlint-local
        name: swiftlint (local if available)
        entry: bash -lc 'command -v swiftlint >/dev/null 2>&1 || exit 0; swiftlint --quiet'
        language: system
        pass_filenames: false
        files: \.(swift)$
