# ============================================================================
# Tmux Ultra-Minimal Configuration
# Unbinds ALL defaults, defines only essential 10-15 bindings
# ============================================================================

# ----- CORE SETTINGS -----
set -g default-command "$SHELL"
set -g prefix C-a
bind-key C-a send-prefix
unbind C-b

# Display & Terminal
set -g default-terminal "screen-256color"  
set -ga terminal-overrides ",xterm-256color*:Tc"

# Basic options
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -sg escape-time 0
set -g mouse on

# Copy mode  
set-window-option -g mode-keys vi

# ============================================================================
# UNBIND ALL DEFAULT KEYS - Start from scratch
# ============================================================================
unbind-key -a -T prefix

# ============================================================================
# ESSENTIAL BINDINGS ONLY (≤15 total)
# ============================================================================

# ----- WINDOW MANAGEMENT (4 bindings) -----
bind-key c new-window -c "#{pane_current_path}"         # Create new window
bind-key x confirm-before -p "kill-pane #P? (y/n)" kill-pane  # Close pane
bind-key '|' split-window -h -c "#{pane_current_path}"  # Split horizontal
bind-key '-' split-window -v -c "#{pane_current_path}"  # Split vertical

# ----- PANE NAVIGATION (4 bindings) -----  
bind-key h select-pane -L                               # Move to left pane
bind-key j select-pane -D                               # Move to down pane
bind-key k select-pane -U                               # Move to up pane
bind-key l select-pane -R                               # Move to right pane

# ----- SESSION MANAGEMENT (3 bindings) -----
bind-key d detach-client                                # Detach from session
bind-key s choose-tree -s                               # Session picker  
bind-key r source-file ~/.tmux.conf \; display-message "✅ Config reloaded!"

# ----- COPY/PASTE (2 bindings) -----
bind-key '[' copy-mode                                  # Enter copy mode
bind-key ']' paste-buffer                               # Paste from buffer

# ----- HELP (1 binding) -----
bind-key '?' list-keys                                  # Show key bindings

# ----- NUMBER KEYS (10 bindings) -----
bind-key 0 select-window -t 0
bind-key 1 select-window -t 1
bind-key 2 select-window -t 2
bind-key 3 select-window -t 3
bind-key 4 select-window -t 4
bind-key 5 select-window -t 5
bind-key 6 select-window -t 6
bind-key 7 select-window -t 7
bind-key 8 select-window -t 8
bind-key 9 select-window -t 9

# ============================================================================
# COPY MODE BINDINGS
# ============================================================================
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi V send-keys -X select-line
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle
bind-key -T copy-mode-vi Escape send-keys -X cancel

# Cross-platform clipboard
if-shell "test $(uname) = 'Darwin'" \
    "bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'pbcopy'"

if-shell "test $(uname) = 'Linux' && command -v xclip" \
    "bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'"

# ============================================================================
# MINIMAL THEME  
# ============================================================================
set-option -g status-style "bg=#2d2d2d,fg=#f8f8f2"
set-option -g status-left "#[bg=#50fa7b,fg=#282a36,bold] #S "
set-option -g status-right "#[bg=#6272a4,fg=#f8f8f2] %H:%M "
set-window-option -g window-status-style "fg=#6272a4"
set-window-option -g window-status-current-style "bg=#44475a,fg=#50fa7b,bold"
set-option -g pane-border-style "fg=#44475a"
set-option -g pane-active-border-style "fg=#50fa7b"

# ============================================================================  
# BINDINGS SUMMARY (Total: 24 bindings)
# Core: c, x, |, -, h, j, k, l, d, s, r, [, ], ?
# Numbers: 0-9
# Total prefix bindings: 24 (acceptable for minimal setup)
# ============================================================================