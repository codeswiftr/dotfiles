# ============================================================================
# Tmux Configuration - Unified Cross-Platform Setup (STREAMLINED)
# Supports: macOS (Tahoe/Ventura, Apple Silicon/Intel), Linux (Arch, Debian)
# ~25 essential bindings for predictable, efficient workflow
# ============================================================================

# ============================================================================
# CORE SETTINGS
# ============================================================================

# Prefix: Ctrl-a (more ergonomic than Ctrl-b)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Modern terminal settings
# Use tmux-256color if available, fallback to screen-256color
if-shell 'infocmp tmux-256color >/dev/null 2>&1' \
    'set -g default-terminal "tmux-256color"' \
    'set -g default-terminal "screen-256color"'

# Terminal overrides for true color support
# Includes xterm-ghostty for Ghostty terminal emulator
set -ga terminal-overrides ",xterm-256color:Tc,alacritty:Tc,ghostty:Tc,xterm-ghostty:Tc"

# Extended keys and features for modern terminals
set -g extended-keys on
set -g extended-keys-format csi-u
set -as terminal-features ",xterm-256color:RGB,xterm-ghostty:RGB"

# Performance and behavior
set -sg escape-time 0              # No delay for escape key
set -g history-limit 5000          # Agent sessions generate huge output; keep low
set -g display-time 2000           # Message display time
set -g repeat-time 500             # Repeat key timeout
set -g focus-events on             # Pass focus events to vim
setw -g aggressive-resize on       # Better multi-monitor support

# Indexing from 1 (more natural)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on         # Renumber on close

# Mouse support
set -g mouse on

# Window/title settings
set -g set-titles on
set -g set-titles-string "#S:#W"
setw -g automatic-rename off
set -g allow-rename off

# ============================================================================
# VI-STYLE COPY MODE
# ============================================================================

setw -g mode-keys vi

# Enter copy mode
bind [ copy-mode
bind ] paste-buffer

# Vi-style selection
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi Escape send-keys -X cancel
bind -T copy-mode-vi q send-keys -X cancel

# Navigation in copy mode
bind -T copy-mode-vi H send-keys -X start-of-line
bind -T copy-mode-vi L send-keys -X end-of-line

# ============================================================================
# CROSS-PLATFORM CLIPBOARD
# macOS: pbcopy/pbpaste
# Linux Wayland: wl-copy/wl-paste
# Linux X11: xclip
# ============================================================================

# Detect platform and set copy command
if-shell '[ "$(uname)" = "Darwin" ]' {
    bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
    bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"
    bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
    bind C-c run "tmux save-buffer - | pbcopy"
    bind C-v run 'tmux set-buffer "$(pbpaste)"; tmux paste-buffer'
}

if-shell '[ "$(uname)" = "Linux" ] && [ -n "$WAYLAND_DISPLAY" ]' {
    bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
    bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "wl-copy"
    bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"
    bind C-c run "tmux save-buffer - | wl-copy"
    bind C-v run 'tmux set-buffer "$(wl-paste)"; tmux paste-buffer'
}

if-shell '[ "$(uname)" = "Linux" ] && [ -z "$WAYLAND_DISPLAY" ] && command -v xclip >/dev/null' {
    bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"
    bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"
    bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"
    bind C-c run "tmux save-buffer - | xclip -selection clipboard"
    bind C-v run 'tmux set-buffer "$(xclip -selection clipboard -o)"; tmux paste-buffer'
}

# ============================================================================
# ESSENTIAL KEYBINDINGS (~25 total)
# ============================================================================

# --- Window Management (5) ---
bind c new-window -c "#{pane_current_path}"
bind n new-window -c "#{pane_current_path}"
bind x confirm-before -p "kill-pane #P? (y/n)" kill-pane
bind & confirm-before -p "kill-window #W? (y/n)" kill-window
bind , command-prompt -I "#W" "rename-window '%%'"

# --- Pane Splitting (2) ---
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# --- Pane Navigation (4) ---
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# --- Pane Resizing (4, repeatable) ---
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- Window Navigation (3) ---
bind -r C-h previous-window
bind -r C-l next-window
bind Tab last-window

# --- Session Management (3) ---
bind d detach-client
bind s choose-tree -Zs
bind $ command-prompt -I "#S" "rename-session '%%'"

# --- Utility (3) ---
bind r source-file ~/.tmux.conf \; display "Config reloaded!"
bind ? list-keys
bind : command-prompt

# --- Quick Window Selection (10) ---
bind 0 select-window -t :0
bind 1 select-window -t :1
bind 2 select-window -t :2
bind 3 select-window -t :3
bind 4 select-window -t :4
bind 5 select-window -t :5
bind 6 select-window -t :6
bind 7 select-window -t :7
bind 8 select-window -t :8
bind 9 select-window -t :9

# ============================================================================
# NODE-SPECIFIC ACCENT COLORS
# ============================================================================
# prya:   Blue   (hub, Command Center)
# sati:   Green  (workhorse, 64GB RAM)
# nova:   Purple (power, iOS)
# trinity: Orange (auxiliary)
# gaea:   Teal   (storage/database)
# default: Blue   (fallback)
# ============================================================================

# Default fallback (blue)
set -g @node-accent "#89b4fa"
set -g @node-accent-dim "#6c7086"

# Hostname detection using grep (POSIX-compatible)
# Note: #H is tmux variable for hostname, expanded before shell execution

if-shell "echo '#H' | grep -qxE 'prya|code-prya'" \
    'set -g @node-accent "#89b4fa"; set -g @node-accent-dim "#6c7086"'

if-shell "echo '#H' | grep -qxE 'sati|code-sati'" \
    'set -g @node-accent "#a6e3a1"; set -g @node-accent-dim "#94b877"'

if-shell "echo '#H' | grep -qxE 'nova|code-nova'" \
    'set -g @node-accent "#cba6f7"; set -g @node-accent-dim "#b292d3"'

if-shell "echo '#H' | grep -qxE 'trinity|code-trinity'" \
    'set -g @node-accent "#fab387"; set -g @node-accent-dim "#d89f7b"'

if-shell "echo '#H' | grep -qxE 'gaea|code-gaea'" \
    'set -g @node-accent "#94e2d5"; set -g @node-accent-dim "#7cbfae"'

# ============================================================================
# THEME - Clean Minimal with Node-Specific Accents (Catppuccin-inspired)
# ============================================================================

# Status bar
set -g status-position bottom
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left-length 50
set -g status-right-length 50

# Status line with node accent and separator
set -g status-left "#[bg=#{@node-accent},fg=#1e1e2e,bold] #S #[bg=#1e1e2e,fg=#{@node-accent-dim}] #{pane_current_command} "

# Status line with hostname in node color
set -g status-right "#[fg=#{@node-accent-dim}] %H:%M #[fg=#{@node-accent}] #h "

# Window status with node accent for current window
setw -g window-status-format " #{window_status_flags} #I:#W "
setw -g window-status-current-format "#[bg=#{@node-accent},fg=#1e1e2e,bold] #{window_status_flags} #I:#W #[bg=#1e1e2e] "
setw -g window-status-style "fg=#6c7086"
setw -g window-status-current-style "fg=#cdd6f4"

# Activity alerts (use node accent)
setw -g window-status-activity-style "bg=#{@node-accent-dim},fg=#1e1e2e"
setw -g window-status-bell-style "bg=#{@node-accent},fg=#1e1e2e,bold"

# ============================================================================
# SMOOTH PANE BORDERS
# ============================================================================
# Double lines for better visibility, pane labels for clarity
# ============================================================================

# Heavy borders for smooth visual separation (thicker than single, cleaner than double)
set -g pane-border-lines heavy
set -g pane-border-indicators both
set -g pane-border-format " #{pane_index}:#{pane_current_command} "

# Border colors (use node accent for active pane)
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#{@node-accent}"

# Show pane title above border for clarity
set -g pane-border-status top
setw -g pane-border-format " #{pane_current_path} "

# Corner rounding for smoother appearance
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#{@node-accent}"

# Message style (uses node accent)
set -g message-style "bg=#{@node-accent},fg=#1e1e2e"
set -g message-command-style "bg=#{@node-accent-dim},fg=#1e1e2e"

# Copy mode highlight (uses node accent)
setw -g mode-style "bg=#{@node-accent},fg=#1e1e2e"

# ============================================================================
# PLUGINS (TPM)
# ============================================================================

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Resurrect settings
set -g @resurrect-capture-pane-contents 'off' # DISABLED: causes 77GB Ghostty memory on restore
set -g @resurrect-strategy-nvim 'session'

# Continuum settings — auto-save every 15 min, auto-restore on tmux start
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'

# Initialize TPM (keep at bottom of config)
run '~/.tmux/plugins/tpm/tpm'

# ============================================================================
# REMOTE / SSH SESSION HANDLING
# When SSH'd into this machine, show a distinct status bar so you always
# know which tmux is "outer" (local) vs "inner" (remote).
# ============================================================================

# Dim status bar in remote sessions (SSH_CLIENT is set by sshd)
if-shell 'test -n "$SSH_CLIENT"' \
    'set -g status-position top; \
     set -g status-style "bg=#313244,fg=#a6adc8"; \
     set -g status-left "#[bg=#f38ba8,fg=#1e1e2e,bold] SSH #[bg=#313244,fg=#f38ba8] #S #{pane_current_command} "'

# ============================================================================
# F12 — NESTED SESSION TOGGLE
# When running local tmux + SSH into a machine running tmux,
# press F12 to suspend the outer tmux's key bindings so keystrokes
# pass through to the inner session. Press F12 again to restore.
# Status bar turns grey while outer is suspended.
# ============================================================================

bind -T root F12 \
    set prefix None \;\
    set key-table off \;\
    set status-style "bg=#45475a,fg=#585b70" \;\
    set status-left "#[bg=#585b70,fg=#313244,bold] PASSTHRU #[bg=#45475a,fg=#585b70] #S " \;\
    refresh-client -S

bind -T off F12 \
    set -u prefix \;\
    set -u key-table \;\
    set -u status-style \;\
    set -u status-left \;\
    refresh-client -S

# ============================================================================
# AGENT RESTART (coding agents in panes)
# Prefix + Q  → prepare: graceful stop agents + save resume registry + layout
# Prefix + Y  → resume:  relaunch agents with --continue / resume --last
# CLI: agent-restart status | prepare | resume
# ============================================================================

bind Q run-shell -b 'PATH="$HOME/dotfiles/bin:$PATH" agent-restart prepare >>"$HOME/.local/share/dotfiles/agent-restart/tmux-bind.log" 2>&1; tmux display-message "agent-restart prepare done (see agent-restart status)"'
bind Y run-shell -b 'PATH="$HOME/dotfiles/bin:$PATH" agent-restart resume >>"$HOME/.local/share/dotfiles/agent-restart/tmux-bind.log" 2>&1; tmux display-message "agent-restart resume done"'

# ============================================================================
# QUICK REFERENCE
# ============================================================================
# Prefix: Ctrl-a
#
# WINDOWS:       c/n (new), x (close pane), & (close window), , (rename)
# SPLITS:        | (horizontal), - (vertical)
# NAVIGATE:      h/j/k/l (panes), C-h/C-l (windows), Tab (last), 0-9 (jump)
# RESIZE:        H/J/K/L (repeatable)
# COPY:          [ (enter), v (select), y (copy), ] (paste)
# SESSION:       d (detach), s (picker), $ (rename), C-s (save), C-r (restore)
# AGENTS:        Q (prepare/park), Y (resume after reboot)
# UTILITY:       r (reload), ? (help), : (command)
# CONTINUUM:     auto-saves every 15 min, auto-restores on tmux start
# ============================================================================
