# ============================================================================
# Tmux Streamlined Configuration
# Essential functionality only - ≤15 total bindings
# Restores standard tmux behavior, moves dev tools to menus
# ============================================================================

# ----- CORE SETTINGS -----
# Load simplified core settings (no bloat)
source-file "$HOME/dotfiles/config/tmux/core-simple.conf"

# ----- ESSENTIAL BINDINGS (Tier 1) -----
# Load only the 10 most essential bindings
source-file "$HOME/dotfiles/config/tmux/bindings-tier1.conf"

# ----- MINIMAL THEME -----
# Simple, clean status bar
set-option -g status-style "bg=#2d2d2d,fg=#f8f8f2"
set-option -g status-left "#[bg=#50fa7b,fg=#282a36,bold] #S #[bg=#2d2d2d] "
set-option -g status-left-length 20

set-option -g status-right "#[bg=#6272a4,fg=#f8f8f2] %Y-%m-%d %H:%M "
set-option -g status-right-length 50

# Window status
set-window-option -g window-status-style "fg=#6272a4"
set-window-option -g window-status-current-style "bg=#44475a,fg=#50fa7b,bold"
set-window-option -g window-status-format " #I:#W "
set-window-option -g window-status-current-format " #I:#W "

# Pane borders
set-option -g pane-border-style "fg=#44475a"
set-option -g pane-active-border-style "fg=#50fa7b"

# ============================================================================
# QUICK REFERENCE COMMENT BLOCK
# ============================================================================

# ESSENTIAL BINDINGS (memorize these):
# Ctrl-a c   → New window
# Ctrl-a d   → Detach session  
# Ctrl-a |   → Split horizontal
# Ctrl-a -   → Split vertical
# Ctrl-a hjkl → Navigate panes
# Ctrl-a x   → Close pane
# Ctrl-a s   → Session picker
# Ctrl-a [   → Copy mode
# Ctrl-a ]   → Paste
# Ctrl-a ?   → Help
#
# DEV TOOLS (uppercase letters):
# Ctrl-a A   → AI tools menu
# Ctrl-a D   → Dev tools menu  
# Ctrl-a T   → Testing menu
# Ctrl-a G   → Git tools menu
# Ctrl-a M   → Monitoring menu