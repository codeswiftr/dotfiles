# ============================================================================
# Tmux Tier 1 Bindings - Essential Operations Only (≤10 bindings)
# Restores standard tmux functionality, moves dev tools to uppercase keys
# ============================================================================

# ----- WINDOW MANAGEMENT (4 bindings) -----
# Using alternative keys to avoid conflicts with standard tmux
bind-key n new-window -c "#{pane_current_path}"      # Create new window (n for new)
bind-key x kill-pane                                 # Close current pane
bind-key '|' split-window -h -c "#{pane_current_path}"  # Split horizontal
bind-key '-' split-window -v -c "#{pane_current_path}"  # Split vertical

# ----- PANE NAVIGATION (4 bindings) -----
# Vim-style navigation
bind-key h select-pane -L    # Move to left pane  
bind-key j select-pane -D    # Move to down pane
bind-key k select-pane -U    # Move to up pane
bind-key l select-pane -R    # Move to right pane

# ----- SESSION MANAGEMENT (2 bindings) ----- 
# Using alternative keys to avoid conflicts with standard tmux
bind-key z detach-client                             # Detach from session (z for detach)
bind-key s choose-session                            # Session picker

# ----- COPY/PASTE (2 bindings) -----
bind-key '[' copy-mode                               # Enter copy mode
bind-key ']' paste-buffer                            # Paste from buffer

# ----- HELP & CONFIG (1 binding) -----
bind-key '?' list-keys                               # Show key bindings

# ============================================================================
# DEVELOPMENT TOOLS - Moved to Uppercase Letters
# These replace the conflicting lowercase bindings
# ============================================================================

# ----- AI TOOLS MENU (Ctrl-a A) -----
bind-key A display-menu -T "🤖 AI Tools" \
    "Claude Interactive" 1 "split-window -h -c '#{pane_current_path}' 'claude --interactive'" \
    "Aider Code Assistant" 2 "split-window -h -c '#{pane_current_path}' 'aider'" \
    "Gemini AI" 3 "split-window -h -c '#{pane_current_path}' 'dot ai review'"

# ----- DEVELOPMENT TOOLS MENU (Ctrl-a D) -----  
bind-key D display-menu -T "🐳 Dev Tools" \
    "Docker Compose Up" 1 "split-window -v -c '#{pane_current_path}' 'docker compose up'" \
    "FastAPI Dev" 2 "split-window -v -c '#{pane_current_path}' 'fastapi dev'" \
    "Development Server" 3 "split-window -v -c '#{pane_current_path}' 'npm run dev'"

# ----- TESTING TOOLS MENU (Ctrl-a T) -----
bind-key T display-menu -T "🧪 Testing" \
    "Pytest Watch" 1 "split-window -v -c '#{pane_current_path}' 'pytest-watch'" \
    "Run Tests" 2 "split-window -v -c '#{pane_current_path}' 'dot test run'" \
    "Test Coverage" 3 "split-window -v -c '#{pane_current_path}' 'dot test coverage'"

# ----- GIT TOOLS MENU (Ctrl-a G) -----
bind-key G display-menu -T "📊 Git Tools" \
    "Git Status" 1 "split-window -h -c '#{pane_current_path}' 'git status && echo && echo \"Press any key to continue...\" && read'" \
    "Git Log" 2 "split-window -h -c '#{pane_current_path}' 'git log --oneline -10 && echo && echo \"Press any key to continue...\" && read'" \
    "Git Diff" 3 "split-window -h -c '#{pane_current_path}' 'git diff && echo && echo \"Press any key to continue...\" && read'"

# ----- MONITORING TOOLS MENU (Ctrl-a M) -----
bind-key M display-menu -T "📊 Monitoring" \
    "System Monitor" 1 "split-window -h -c '#{pane_current_path}' 'htop'" \
    "Performance Check" 2 "split-window -v -c '#{pane_current_path}' 'dot perf measure'" \
    "System Health" 3 "split-window -v -c '#{pane_current_path}' 'dot check'"

# ============================================================================
# STATUS MESSAGE
# ============================================================================

# Show a message when config is reloaded
bind-key r source-file ~/.tmux.conf \; display-message "✅ Tmux config reloaded! Essential bindings restored."