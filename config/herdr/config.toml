# Herdr Configuration — Modern Agent-Native Terminal Workspace
# Symlinked to ~/.config/herdr/config.toml via Chezmoi
onboarding = false

[terminal]
new_cwd = "follow"

[session]
# Native agent conversation resume across server restarts
resume_agents_on_restore = true

[ui]
accent = "#89b4fa"
pane_borders = true
pane_gaps = true
show_agent_labels_on_pane_borders = true

agent_panel_sort = "priority"
[ui.toast]
delivery = "terminal"
delay_seconds = 1

[ui.toast.clipboard]
enabled = true
position = "bottom-center"

[keys]
prefix = "ctrl+a"

# Detach (tmux + Herdr default)
detach = ["prefix+d", "prefix+q"]

# Config Reload (do not bind prefix+r; that is resize_mode)
reload_config = "prefix+shift+r"

# Splits (full tmux muscle memory)
split_vertical = ["prefix+|", "prefix+v"]
split_horizontal = "prefix+minus"

# Workspace & Tab Management (tmux parity)
workspace_picker = ["prefix+w", "prefix+s"]
rename_workspace = ["prefix+shift+w", "prefix+$"]
new_workspace = "prefix+shift+n"
switch_workspace = "prefix+shift+1..9"

rename_tab = ["prefix+shift+t", "prefix+,"]
close_tab = ["prefix+shift+x", "prefix+&"]

# Navigation & Utilities
last_pane = "prefix+tab"
toggle_sidebar = "prefix+b"

[experimental]
pane_history = true

