name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bats:
    name: bats + shellcheck
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      DOTFILES_DIR: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - name: Install bats and shellcheck
        run: brew install bats-core shellcheck

      - name: Shell syntax (zsh loader)
        run: |
          zsh -n .zshrc
          zsh -n config/zsh/defaults.zsh
          zsh -n config/zsh/core.zsh
          zsh -n config/zsh/agent-safe.zsh

      - name: shellcheck scripts
        run: |
          shellcheck bin/ai bin/_agent scripts/check.sh scripts/update.sh scripts/reload.sh || true
          shellcheck install.sh || true

      - name: bats suite
        run: |
          chmod +x bin/* tests/bats/*.bats 2>/dev/null || true
          bats tests/bats/smoke.bats tests/bats/infrastructure.bats

  cleanroom:
    name: Ubuntu clean-room dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build clean-room image (timed)
        run: |
          set -euo pipefail
          START=$(date +%s)
          docker build -f tests/Dockerfile.test -t dotfiles-test:ci .
          END=$(date +%s)
          echo "cleanroom_elapsed_sec=$((END-START))"
          echo "cleanroom_elapsed_sec=$((END-START))" >> "$GITHUB_STEP_SUMMARY"
