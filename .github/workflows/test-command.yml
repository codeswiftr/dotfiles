name: 🎯 Manual Test Commands

on:
  issue_comment:
    types: [created]

env:
  DOTFILES_CI: true
  DOTFILES_AGENT_MODE: true

jobs:
  parse-command:
    name: 📋 Parse Test Command
    runs-on: ubuntu-latest
    if: github.event.issue.pull_request && startsWith(github.event.comment.body, '/test')
    outputs:
      command: ${{ steps.parse.outputs.command }}
      category: ${{ steps.parse.outputs.category }}
      platform: ${{ steps.parse.outputs.platform }}
      should_run: ${{ steps.parse.outputs.should_run }}
    steps:
      - name: Parse command
        id: parse
        run: |
          COMMENT="${{ github.event.comment.body }}"
          echo "Processing command: $COMMENT"
          
          # Parse test command
          if [[ "$COMMENT" =~ ^/test[[:space:]]*(.*) ]]; then
            ARGS="${BASH_REMATCH[1]}"
            echo "command=/test $ARGS" >> $GITHUB_OUTPUT
            
            # Parse category
            if [[ "$ARGS" =~ --category[[:space:]]+([a-z_]+) ]] || [[ "$ARGS" =~ -c[[:space:]]+([a-z_]+) ]]; then
              CATEGORY="${BASH_REMATCH[1]}"
            elif [[ "$ARGS" =~ (all|infrastructure|unit|integration|performance) ]]; then
              CATEGORY="${BASH_REMATCH[1]}"
            else
              CATEGORY="all"
            fi
            
            # Parse platform
            if [[ "$ARGS" =~ --platform[[:space:]]+([a-z]+) ]] || [[ "$ARGS" =~ -p[[:space:]]+([a-z]+) ]]; then
              PLATFORM="${BASH_REMATCH[1]}"
            elif [[ "$ARGS" =~ (macos|ubuntu|linux) ]]; then
              PLATFORM="${BASH_REMATCH[1]}"
            else
              PLATFORM="ubuntu"
            fi
            
            echo "category=$CATEGORY" >> $GITHUB_OUTPUT
            echo "platform=$PLATFORM" >> $GITHUB_OUTPUT
            echo "should_run=true" >> $GITHUB_OUTPUT
            
          elif [[ "$COMMENT" == "/test" ]]; then
            echo "command=/test" >> $GITHUB_OUTPUT
            echo "category=all" >> $GITHUB_OUTPUT
            echo "platform=ubuntu" >> $GITHUB_OUTPUT
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi

      - name: Add reaction to comment
        if: steps.parse.outputs.should_run == 'true'
        uses: actions/github-script@v6
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: ${{ github.event.comment.id }},
              content: 'rocket'
            });

  manual-test:
    name: 🧪 Execute Manual Test
    runs-on: ${{ matrix.runner }}
    needs: [parse-command]
    if: needs.parse-command.outputs.should_run == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu
            runner: ubuntu-latest
          - platform: macos
            runner: macos-latest
    steps:
      - name: Get PR details
        id: pr
        uses: actions/github-script@v6
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            
            return {
              head_ref: pr.head.ref,
              head_sha: pr.head.sha,
              base_ref: pr.base.ref
            };

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ fromJson(steps.pr.outputs.result).head_ref }}
          fetch-depth: 0

      - name: Setup test environment
        run: |
          if [[ "${{ matrix.platform }}" == "macos" ]]; then
            # macOS setup
            brew install shellcheck yamllint bc python@3.11
            python3 -m pip install --user pyyaml
          else
            # Ubuntu setup
            sudo apt-get update
            sudo apt-get install -y shellcheck yamllint bc python3 python3-pip
            python3 -m pip install --user pyyaml
          fi
          
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          mkdir -p tests/results

      - name: Execute requested tests
        id: test_execution
        run: |
          echo "::group::Manual Test Execution"
          
          CATEGORY="${{ needs.parse-command.outputs.category }}"
          COMMAND="${{ needs.parse-command.outputs.command }}"
          
          echo "Executing: $COMMAND"
          echo "Category: $CATEGORY"
          echo "Platform: ${{ matrix.platform }}"
          
          # Build test command
          TEST_CMD="./tests/test_runner.sh --category $CATEGORY --verbose"
          
          # Execute tests
          if timeout 45m bash -c "$TEST_CMD"; then
            echo "result=success" >> $GITHUB_OUTPUT
            echo "✅ Tests completed successfully"
          else
            echo "result=failure" >> $GITHUB_OUTPUT
            echo "❌ Tests failed or timed out"
          fi
          
          echo "::endgroup::"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manual-test-results-${{ matrix.platform }}-${{ github.run_number }}
          path: |
            tests/results/
          retention-days: 30

      - name: Comment test results
        uses: actions/github-script@v6
        if: always()
        with:
          script: |
            const fs = require('fs');
            const category = '${{ needs.parse-command.outputs.category }}';
            const platform = '${{ matrix.platform }}';
            const result = '${{ steps.test_execution.outputs.result }}';
            const runUrl = `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            
            const emoji = result === 'success' ? '✅' : '❌';
            const status = result === 'success' ? 'PASSED' : 'FAILED';
            
            let resultSummary = '';
            try {
              // Try to read test results if available
              const resultFiles = ['tests/results/comprehensive_report.md', 'tests/results/summary.md'];
              for (const file of resultFiles) {
                if (fs.existsSync(file)) {
                  const content = fs.readFileSync(file, 'utf8');
                  resultSummary = content.substring(0, 500) + (content.length > 500 ? '...' : '');
                  break;
                }
              }
            } catch (error) {
              console.log('Could not read test results:', error.message);
            }
            
            const body = `## ${emoji} Manual Test Results - ${platform}
            
            **Command:** \`${{ needs.parse-command.outputs.command }}\`  
            **Category:** ${category}  
            **Platform:** ${platform}  
            **Status:** ${status}  
            **Run:** [#${{ github.run_number }}](${runUrl})
            
            ${resultSummary ? `### Summary\n\n${resultSummary}` : ''}
            
            ${result === 'success' ? 
              '🎉 All tests passed! This PR is ready for review.' : 
              '🔧 Some tests failed. Please check the detailed results and fix any issues.'
            }
            
            [📊 View detailed results](${runUrl})`;
            
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  help-command:
    name: 💬 Show Test Help
    runs-on: ubuntu-latest
    if: github.event.issue.pull_request && github.event.comment.body == '/test help'
    steps:
      - name: Add help comment
        uses: actions/github-script@v6
        with:
          script: |
            const body = `## 🧪 Manual Test Commands
            
            Use these commands to trigger manual testing on your PR:
            
            ### Basic Commands
            - \`/test\` - Run all test categories on Ubuntu
            - \`/test quick\` - Run quick validation only
            - \`/test help\` - Show this help message
            
            ### Category-Specific Tests
            - \`/test infrastructure\` - Test installation and configuration
            - \`/test unit\` - Run unit tests for individual functions
            - \`/test integration\` - Run end-to-end integration tests
            - \`/test performance\` - Run performance benchmarks
            
            ### Platform-Specific Tests
            - \`/test --platform macos\` - Run tests on macOS
            - \`/test --platform ubuntu\` - Run tests on Ubuntu (default)
            
            ### Advanced Options
            - \`/test integration --platform macos\` - Integration tests on macOS
            - \`/test --category unit --platform ubuntu\` - Unit tests on Ubuntu
            
            ### Examples
            \`\`\`
            /test                                    # Full test suite
            /test performance                        # Performance tests only
            /test --category integration --platform macos  # Integration tests on macOS
            \`\`\`
            
            ### 📊 Results
            
            Test results will be posted as a comment with:
            - ✅ Success/❌ Failure status
            - Summary of test results
            - Link to detailed logs and artifacts
            - Platform and category information
            
            ### 🚀 Automated Testing
            
            Remember that tests also run automatically on:
            - Every push to your PR (quick validation)
            - Manual triggers via GitHub Actions
            - Scheduled performance monitoring
            
            Need help? Check the [testing documentation](docs/testing.md) or ask in the discussion!`;
            
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });