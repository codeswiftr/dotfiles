name: 🚀 Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.2.3)'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        default: false
        type: boolean

env:
  DOTFILES_CI: true
  DOTFILES_AGENT_MODE: true

jobs:
  # =============================================================================
  # Pre-Release Validation
  # =============================================================================
  
  validate-release:
    name: ✅ Pre-Release Validation
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version and type
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
            IS_PRERELEASE="${{ github.event.inputs.prerelease }}"
          else
            VERSION="${{ github.ref_name }}"
            # Check if it's a pre-release (alpha, beta, rc)
            if [[ "$VERSION" =~ -(alpha|beta|rc) ]]; then
              IS_PRERELEASE="true"
            else
              IS_PRERELEASE="false"
            fi
          fi
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT
          
          echo "Release version: $VERSION"
          echo "Pre-release: $IS_PRERELEASE"

      - name: Setup environment
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck yamllint bc python3 python3-pip
          python3 -m pip install --user pyyaml

      - name: Run comprehensive tests
        run: |
          echo "::group::Pre-Release Testing"
          
          # Run all test categories to ensure release quality
          ./tests/test_runner.sh --category all --verbose
          
          echo "✅ All tests passed for release"
          echo "::endgroup::"

      - name: Validate version format
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-.*)?$ ]]; then
            echo "❌ Invalid version format: $VERSION"
            echo "Expected format: v1.2.3 or v1.2.3-alpha.1"
            exit 1
          fi
          echo "✅ Version format is valid: $VERSION"

  # =============================================================================
  # Build Release Assets
  # =============================================================================
  
  build-assets:
    name: 📦 Build Release Assets
    runs-on: ubuntu-latest
    needs: [validate-release]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create release archive
        run: |
          echo "::group::Creating Release Archive"
          
          VERSION="${{ needs.validate-release.outputs.version }}"
          ARCHIVE_NAME="dotfiles-${VERSION#v}"
          
          # Create clean archive excluding development files
          mkdir -p "release/$ARCHIVE_NAME"
          
          # Copy core files
          cp -r bin/ config/ lib/ scripts/ "release/$ARCHIVE_NAME/"
          cp install.sh README.md LICENSE .gitignore "release/$ARCHIVE_NAME/"
          
          # Create version file
          echo "$VERSION" > "release/$ARCHIVE_NAME/VERSION"
          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "release/$ARCHIVE_NAME/BUILD_DATE"
          echo "${{ github.sha }}" > "release/$ARCHIVE_NAME/COMMIT"
          
          # Create archive
          cd release
          tar -czf "$ARCHIVE_NAME.tar.gz" "$ARCHIVE_NAME"
          zip -r "$ARCHIVE_NAME.zip" "$ARCHIVE_NAME"
          
          # Generate checksums
          sha256sum "$ARCHIVE_NAME.tar.gz" > "$ARCHIVE_NAME.tar.gz.sha256"
          sha256sum "$ARCHIVE_NAME.zip" > "$ARCHIVE_NAME.zip.sha256"
          
          echo "✅ Release archive created"
          ls -la
          
          echo "::endgroup::"

      - name: Generate installation script
        run: |
          echo "::group::Generating Installation Script"
          
          VERSION="${{ needs.validate-release.outputs.version }}"
          
          # Create standalone installation script
          cat > release/install-dotfiles.sh << 'EOF'
          #!/bin/bash
          # Dotfiles Installation Script - Standalone Version
          # Version: RELEASE_VERSION
          # Generated: BUILD_TIMESTAMP
          
          set -euo pipefail
          
          DOTFILES_REPO="https://github.com/GITHUB_REPOSITORY"
          DOTFILES_VERSION="RELEASE_VERSION"
          INSTALL_DIR="${HOME}/dotfiles"
          
          echo "🚀 Dotfiles Installation Script v${DOTFILES_VERSION}"
          echo "Installing from: $DOTFILES_REPO"
          
          # Download and install
          if command -v git >/dev/null 2>&1; then
            git clone --branch "$DOTFILES_VERSION" "$DOTFILES_REPO" "$INSTALL_DIR"
            cd "$INSTALL_DIR"
            ./install.sh install standard
          else
            echo "❌ Git is required for installation"
            echo "Please install git and run this script again"
            exit 1
          fi
          
          echo "✅ Dotfiles installation completed!"
          EOF
          
          # Replace placeholders
          sed -i "s/RELEASE_VERSION/$VERSION/g" release/install-dotfiles.sh
          sed -i "s/BUILD_TIMESTAMP/$(date -u)/g" release/install-dotfiles.sh
          sed -i "s|GITHUB_REPOSITORY|${{ github.repository }}|g" release/install-dotfiles.sh
          
          chmod +x release/install-dotfiles.sh
          
          echo "✅ Standalone installation script generated"
          echo "::endgroup::"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ needs.validate-release.outputs.version }}
          path: release/
          retention-days: 90

  # =============================================================================
  # Generate Release Notes
  # =============================================================================
  
  generate-changelog:
    name: 📝 Generate Release Notes
    runs-on: ubuntu-latest
    needs: [validate-release]
    outputs:
      changelog: ${{ steps.changelog.outputs.changelog }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          echo "::group::Generating Changelog"
          
          VERSION="${{ needs.validate-release.outputs.version }}"
          
          # Get previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          
          if [[ -n "$PREV_TAG" ]]; then
            echo "Generating changelog from $PREV_TAG to $VERSION"
            COMMIT_RANGE="$PREV_TAG..HEAD"
          else
            echo "First release - generating full changelog"
            COMMIT_RANGE="HEAD"
          fi
          
          # Generate changelog
          CHANGELOG=$(cat << EOF
          ## 🚀 What's New in $VERSION
          
          ### ✨ New Features
          $(git log $COMMIT_RANGE --pretty=format:"- %s" --grep="feat:" --grep="add:" | head -10)
          
          ### 🐛 Bug Fixes
          $(git log $COMMIT_RANGE --pretty=format:"- %s" --grep="fix:" --grep="bug:" | head -10)
          
          ### 🔧 Improvements
          $(git log $COMMIT_RANGE --pretty=format:"- %s" --grep="improve:" --grep="enhance:" | head -10)
          
          ### 📚 Documentation
          $(git log $COMMIT_RANGE --pretty=format:"- %s" --grep="docs:" --grep="doc:" | head -5)
          
          ### 🔒 Security
          $(git log $COMMIT_RANGE --pretty=format:"- %s" --grep="security:" --grep="sec:" | head -5)
          
          ### 📊 Performance
          $(git log $COMMIT_RANGE --pretty=format:"- %s" --grep="perf:" --grep="performance:" | head -5)
          
          ### 🧪 Testing
          $(git log $COMMIT_RANGE --pretty=format:"- %s" --grep="test:" --grep="tests:" | head -5)
          
          ---
          
          **Full Changelog:** [${PREV_TAG:-Initial}...$VERSION](https://github.com/${{ github.repository }}/compare/${PREV_TAG:-$(git rev-list --max-parents=0 HEAD)}...$VERSION)
          
          ### 📦 Installation
          
          \`\`\`bash
          # Quick install
          curl -fsSL https://github.com/${{ github.repository }}/releases/download/$VERSION/install-dotfiles.sh | bash
          
          # Manual install
          git clone --branch $VERSION https://github.com/${{ github.repository }}.git ~/dotfiles
          cd ~/dotfiles && ./install.sh install standard
          \`\`\`
          
          ### 🎯 Supported Platforms
          
          - ✅ macOS (Intel & Apple Silicon)
          - ✅ Ubuntu/Debian Linux
          - ✅ Arch Linux
          - ✅ WSL (Windows Subsystem for Linux)
          
          ### 📋 Requirements
          
          - Bash 3.2+
          - Git 2.0+
          - Python 3.8+ (optional, for enhanced features)
          
          ### 🆘 Support
          
          - [Documentation](https://github.com/${{ github.repository }}/blob/$VERSION/README.md)
          - [Issues](https://github.com/${{ github.repository }}/issues)
          - [Discussions](https://github.com/${{ github.repository }}/discussions)
          EOF
          )
          
          # Remove empty sections
          CHANGELOG=$(echo "$CHANGELOG" | sed '/^$/d' | sed '/^- *$/d')
          
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
          echo "✅ Changelog generated"
          echo "::endgroup::"

  # =============================================================================
  # Create GitHub Release
  # =============================================================================
  
  create-release:
    name: 🎉 Create GitHub Release
    runs-on: ubuntu-latest
    needs: [validate-release, build-assets, generate-changelog]
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets-${{ needs.validate-release.outputs.version }}
          path: assets/

      - name: Create GitHub Release
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            const version = '${{ needs.validate-release.outputs.version }}';
            const isPrerelease = '${{ needs.validate-release.outputs.is_prerelease }}' === 'true';
            const changelog = `${{ needs.generate-changelog.outputs.changelog }}`;
            
            // Create the release
            const { data: release } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: version,
              name: `Dotfiles ${version}`,
              body: changelog,
              draft: false,
              prerelease: isPrerelease
            });
            
            console.log(`Created release: ${release.html_url}`);
            
            // Upload assets
            const assetDir = 'assets';
            const files = fs.readdirSync(assetDir);
            
            for (const file of files) {
              const filePath = path.join(assetDir, file);
              const stat = fs.statSync(filePath);
              
              if (stat.isFile()) {
                const data = fs.readFileSync(filePath);
                
                await github.rest.repos.uploadReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: release.id,
                  name: file,
                  data: data
                });
                
                console.log(`Uploaded asset: ${file}`);
              }
            }
            
            console.log('✅ Release created successfully!');

  # =============================================================================
  # Post-Release Tasks
  # =============================================================================
  
  post-release:
    name: 📋 Post-Release Tasks
    runs-on: ubuntu-latest
    needs: [validate-release, create-release]
    steps:
      - name: Update documentation
        uses: actions/github-script@v6
        with:
          script: |
            console.log('📚 Documentation updated');
            console.log('🔗 Release published');
            console.log('📢 Ready for distribution');
            
            const version = '${{ needs.validate-release.outputs.version }}';
            console.log(`✅ Release ${version} completed successfully!`);