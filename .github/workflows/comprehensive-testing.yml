name: 🧪 Comprehensive Testing Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  schedule:
    # Run daily at 6 AM UTC for regression detection
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      test_category:
        description: 'Test category to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - infrastructure
          - unit
          - integration
          - performance
      verbose_mode:
        description: 'Enable verbose output'
        required: false
        default: false
        type: boolean

env:
  DOTFILES_CI: true
  DOTFILES_AGENT_MODE: true

jobs:
  # =============================================================================
  # Pre-flight Checks
  # =============================================================================
  
  preflight:
    name: 🔍 Pre-flight Checks
    runs-on: ubuntu-latest
    outputs:
      should_run_tests: ${{ steps.check.outputs.should_run }}
      test_category: ${{ steps.check.outputs.test_category }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if testing should run
        id: check
        run: |
          # Determine test category
          TEST_CATEGORY="${{ github.event.inputs.test_category || 'all' }}"
          echo "test_category=$TEST_CATEGORY" >> $GITHUB_OUTPUT
          
          # Check if we should run tests (always true for now, but could be enhanced)
          echo "should_run=true" >> $GITHUB_OUTPUT
          
          # Log run context
          echo "::group::Run Context"
          echo "Event: ${{ github.event_name }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Test Category: $TEST_CATEGORY"
          echo "Verbose: ${{ github.event.inputs.verbose_mode || false }}"
          echo "::endgroup::"

  # =============================================================================
  # Linting and Static Analysis
  # =============================================================================
  
  lint:
    name: 🔧 Lint & Static Analysis
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.should_run_tests == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install linting tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck yamllint
          pip install --user pyyaml

      - name: Run ShellCheck
        run: |
          echo "::group::ShellCheck Results"
          find . -name "*.sh" -type f -exec shellcheck -f gcc {} \; || true
          echo "::endgroup::"

      - name: Run yamllint
        run: |
          echo "::group::YAML Lint Results"
          find . -name "*.yaml" -o -name "*.yml" -type f | xargs yamllint || true
          echo "::endgroup::"

      - name: Check YAML parsing
        run: |
          echo "::group::YAML Parsing Test"
          python3 -c "
          import yaml
          import sys
          try:
              with open('config/tools.yaml', 'r') as f:
                  config = yaml.safe_load(f)
              print('✅ YAML parsing successful')
              print(f'Found {len(config.get(\"groups\", {}))} tool groups')
          except Exception as e:
              print(f'❌ YAML parsing failed: {e}')
              sys.exit(1)
          "
          echo "::endgroup::"

  # =============================================================================
  # Cross-Platform Testing Matrix
  # =============================================================================
  
  test-matrix:
    name: 🧪 ${{ matrix.os }} - ${{ matrix.category }}
    runs-on: ${{ matrix.runner }}
    needs: [preflight, lint]
    if: needs.preflight.outputs.should_run_tests == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Testing
          - os: macos
            runner: macos-latest
            category: infrastructure
            package_manager: brew
          - os: macos
            runner: macos-latest  
            category: unit
            package_manager: brew
          
          # Ubuntu Testing
          - os: ubuntu
            runner: ubuntu-latest
            category: infrastructure
            package_manager: apt
          - os: ubuntu
            runner: ubuntu-latest
            category: integration
            package_manager: apt
          - os: ubuntu
            runner: ubuntu-latest
            category: unit
            package_manager: apt
            
          # Performance Testing (Ubuntu only for consistency)
          - os: ubuntu
            runner: ubuntu-latest
            category: performance
            package_manager: apt
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup test environment
        run: |
          echo "::group::Environment Setup"
          # Install basic dependencies
          if [[ "${{ matrix.package_manager }}" == "brew" ]]; then
            # macOS setup
            brew install shellcheck yamllint bc python@3.11
            python3 -m pip install --user pyyaml
          else
            # Ubuntu setup
            sudo apt-get update
            sudo apt-get install -y shellcheck yamllint bc python3 python3-pip
            python3 -m pip install --user pyyaml
          fi
          
          # Set up PATH for user installed packages
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          
          # Create results directory
          mkdir -p tests/results
          
          echo "Environment: ${{ matrix.os }}"
          echo "Package Manager: ${{ matrix.package_manager }}"
          echo "Test Category: ${{ matrix.category }}"
          echo "::endgroup::"

      - name: Run comprehensive tests
        id: test_run
        run: |
          echo "::group::Test Execution"
          
          # Build test command
          TEST_CMD="./tests/test_runner.sh --category ${{ matrix.category }}"
          
          if [[ "${{ github.event.inputs.verbose_mode }}" == "true" ]]; then
            TEST_CMD="$TEST_CMD --verbose"
          fi
          
          # Run tests with timeout
          timeout 30m bash -c "$TEST_CMD" || {
            echo "::error::Tests failed or timed out"
            exit 1
          }
          
          echo "::endgroup::"

      - name: Upload test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.category }}
          path: |
            tests/results/
            tests/results/**/
          retention-days: 30

      - name: Performance regression check
        if: matrix.category == 'performance' && github.event_name == 'pull_request'
        run: |
          echo "::group::Performance Regression Analysis"
          
          # This would compare performance metrics with baseline
          # For now, just ensure performance tests ran successfully
          if [[ -f "tests/results/performance_report.md" ]]; then
            echo "✅ Performance benchmarks completed"
            cat tests/results/performance_report.md
          else
            echo "⚠️  Performance report not found"
          fi
          
          echo "::endgroup::"

  # =============================================================================
  # Security Scanning
  # =============================================================================
  
  security:
    name: 🔒 Security Scanning
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.should_run_tests == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run secret scanning
        run: |
          echo "::group::Secret Scanning"
          
          # Simple secret patterns (in production, use gitleaks or similar)
          echo "Scanning for potential secrets..."
          
          # Check for common secret patterns
          if grep -r -E "(password|secret|key|token).*=.*[\"'][^\"']{8,}" . \
             --exclude-dir=.git --exclude-dir=tests/results --exclude="*.md" || true; then
            echo "⚠️  Potential secrets found - please review"
          else
            echo "✅ No obvious secrets detected"
          fi
          
          echo "::endgroup::"

      - name: Security configuration check
        run: |
          echo "::group::Security Configuration"
          
          # Check for secure defaults
          if [[ -f "lib/cli/security.sh" ]]; then
            echo "✅ Security CLI module found"
          fi
          
          # Verify no overly permissive files
          find . -type f -perm /o+w -not -path "./.git/*" -not -path "./tests/results/*" | head -10
          
          echo "::endgroup::"

  # =============================================================================
  # Integration Testing
  # =============================================================================
  
  integration:
    name: 🔄 Full Integration Test
    runs-on: ubuntu-latest
    needs: [preflight, lint]
    if: needs.preflight.outputs.should_run_tests == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup test environment
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck yamllint bc python3 python3-pip
          python3 -m pip install --user pyyaml

      - name: Test installation flow
        run: |
          echo "::group::Installation Flow Test"
          
          # Test dry-run installation
          ./install.sh install minimal --dry-run
          ./install.sh install standard --dry-run
          ./install.sh install full --dry-run
          
          echo "✅ All installation profiles validated"
          echo "::endgroup::"

      - name: Test DOT CLI
        run: |
          echo "::group::DOT CLI Integration"
          
          export DOTFILES_DIR="$PWD"
          export PATH="$PWD/bin:$PATH"
          
          # Test core commands
          ./bin/dot --help
          ./bin/dot version
          
          echo "✅ DOT CLI integration verified"
          echo "::endgroup::"

  # =============================================================================
  # Reporting and Notifications
  # =============================================================================
  
  report:
    name: 📊 Generate Test Report
    runs-on: ubuntu-latest
    needs: [preflight, lint, test-matrix, security, integration]
    if: always() && needs.preflight.outputs.should_run_tests == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v3
        with:
          path: artifacts/

      - name: Generate comprehensive report
        run: |
          echo "::group::Test Report Generation"
          
          # Create comprehensive test report
          REPORT_FILE="comprehensive-test-report.md"
          
          cat > "$REPORT_FILE" << EOF
          # 🧪 Comprehensive Testing Report
          
          **Run ID:** ${{ github.run_id }}  
          **Commit:** ${{ github.sha }}  
          **Branch:** ${{ github.ref_name }}  
          **Trigger:** ${{ github.event_name }}  
          **Timestamp:** $(date -u)
          
          ## 📋 Test Summary
          
          EOF
          
          # Analyze job results
          if [[ "${{ needs.lint.result }}" == "success" ]]; then
            echo "- ✅ **Linting & Static Analysis:** Passed" >> "$REPORT_FILE"
          else
            echo "- ❌ **Linting & Static Analysis:** Failed" >> "$REPORT_FILE"
          fi
          
          if [[ "${{ needs.test-matrix.result }}" == "success" ]]; then
            echo "- ✅ **Cross-Platform Testing:** Passed" >> "$REPORT_FILE"
          else
            echo "- ❌ **Cross-Platform Testing:** Failed" >> "$REPORT_FILE"
          fi
          
          if [[ "${{ needs.security.result }}" == "success" ]]; then
            echo "- ✅ **Security Scanning:** Passed" >> "$REPORT_FILE"
          else
            echo "- ❌ **Security Scanning:** Failed" >> "$REPORT_FILE"
          fi
          
          if [[ "${{ needs.integration.result }}" == "success" ]]; then
            echo "- ✅ **Integration Testing:** Passed" >> "$REPORT_FILE"
          else
            echo "- ❌ **Integration Testing:** Failed" >> "$REPORT_FILE"
          fi
          
          cat >> "$REPORT_FILE" << EOF
          
          ## 🎯 Test Categories Executed
          
          - **Category:** ${{ needs.preflight.outputs.test_category }}
          - **Platforms:** macOS, Ubuntu
          - **Components:** Infrastructure, Unit, Integration, Performance, Security
          
          ## 📁 Artifacts
          
          All test results, logs, and reports are available in the GitHub Actions artifacts.
          
          ## 🔗 Links
          
          - [Workflow Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          - [Commit Details](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
          
          ---
          *Generated by Dotfiles Testing Framework CI/CD Pipeline*
          EOF
          
          echo "Report generated successfully"
          cat "$REPORT_FILE"
          
          echo "::endgroup::"

      - name: Upload comprehensive report
        uses: actions/upload-artifact@v3
        with:
          name: comprehensive-test-report
          path: comprehensive-test-report.md
          retention-days: 90

      - name: Comment on PR (if applicable)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const reportContent = fs.readFileSync('comprehensive-test-report.md', 'utf8');
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🧪 Automated Test Results\n\n${reportContent}`
            });

  # =============================================================================
  # Cleanup and Maintenance
  # =============================================================================
  
  cleanup:
    name: 🧹 Cleanup
    runs-on: ubuntu-latest
    needs: [report]
    if: always()
    steps:
      - name: Clean up old artifacts
        uses: actions/github-script@v6
        with:
          script: |
            const { data: artifacts } = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            
            // Keep only last 50 artifacts to manage storage
            const sortedArtifacts = artifacts.artifacts.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            const artifactsToDelete = sortedArtifacts.slice(50);
            
            for (const artifact of artifactsToDelete) {
              try {
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                });
                console.log(`Deleted artifact: ${artifact.name}`);
              } catch (error) {
                console.log(`Could not delete artifact ${artifact.name}: ${error.message}`);
              }
            }